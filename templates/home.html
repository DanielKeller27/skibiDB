<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flat-Manager</title>
    <style>
        :root {
            --accent: #007bff;
            --accent-dark: #0056b3;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #222;
            --shadow: 0 4px 12px rgba(0, 0, 0, .06);
            --radius: 14px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .top-header {
            background: var(--card);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .top-header #userName {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .top-header button {
            border: none;
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: .95rem;
        }
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 60px);
        }
        #dashboard {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #content-area {
            min-height: 400px;
        }
        .page main {
            padding: 0;
            max-width: none;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform .15s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .card button {
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background .2s;
        }
        .card button:hover {
            background: var(--accent-dark);
        }

        /* SECTION PAGES */
        .page {
            display: none;
            animation: fadeIn .3s;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page .section-header {
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .welcome-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #888;
            font-size: 1.1rem;
        }
        .item {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .done, .bought {
            text-decoration: line-through;
            opacity: .55;
        }
        .item button {
            margin-left: 6px;
            padding: 6px 10px;
            font-size: .85rem;
        }
    </style>
</head>
<body>
    <!-- ===== TOP BAR ===== -->
    <header class="top-header">
        <span id="userName">User Name</span>
        <button onclick="logout()">Logout</button>
    </header>

    <div class="container">
        <!-- ===== LEFT: DASHBOARD NAV ===== -->
        <nav id="dashboard">
            <div class="card" onclick="showPage('group')">
                <h2>Group</h2>
            </div>
            <div class="card" onclick="showPage('chores')">
                <h2>Chores</h2>
            </div>
            <div class="card" onclick="showPage('assignments')">
                <h2>Assignments</h2>
            </div>
            <div class="card" onclick="showPage('groceries')">
                <h2>Groceries</h2>
            </div>
            <div class="card" onclick="showPage('finances')">
                <h2>Finances</h2>
            </div>
        </nav>

        <!-- ===== RIGHT: CONTENT AREA ===== -->
        <div id="content-area">
            <div id="welcome" class="welcome-msg">Select a section from the left</div>

            <!-- ===== CHORES PAGE ===== -->
            <section id="chores" class="page">
                <div class="section-header">Chores</div>
                <button class="card" onclick="addChore()" style="width:auto;display:inline-block;padding:12px 20px;">+ Add chore</button>
                <div id="choresList" style="margin-top:16px;"></div>
            </section>

            <!-- ===== GROCERIES PAGE ===== -->
            <section id="groceries" class="page">
                <div class="section-header">Groceries</div>
                <button class="card" onclick="addItem()" style="width:auto;display:inline-block;padding:12px 20px;">+ Add item</button>
                <div id="groceriesList" style="margin-top:16px;"></div>
            </section>

            <!-- ===== FINANCES PAGE ===== -->
            <section id="finances" class="page">
                <div class="section-header">Finances</div>
                <button class="card" onclick="addExpense()" style="width:auto;display:inline-block;padding:12px 20px;">+ Add expense</button>
                <div id="financesList" style="margin-top:16px;"></div>
            </section>

            <!-- ===== GROUP PAGE ===== -->
            <section id="group" class="page">
                <div class="section-header">Group Members</div>
                <button class="card" onclick="addMember()" style="width:auto;display:inline-block;padding:12px 20px;">+ Add member</button>
                <div id="groupList" style="margin-top:16px;"></div>
            </section>

            <!-- ===== ASSIGNMENTS PAGE ===== -->
            <section id="assignments" class="page">
                <div class="section-header">Assignments</div>
                <button class="card" onclick="addAssignment()" style="width:auto;display:inline-block;padding:12px 20px;">+ Assign Chore</button>
                <div id="assignmentsList" style="margin-top:16px;"></div>
            </section>
        </div>
    </div>

    <script>
        /* ---------- USER ---------- */
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{"name":"Guest"}');
        document.getElementById('userName').textContent = currentUser.name;

        /* ---------- NAV ---------- */
        function showPage(id) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('welcome').style.display = 'none';
            document.getElementById(id).classList.add('active');
            window[`load${id.charAt(0).toUpperCase() + id.slice(1)}`](); // call loader
        }
        function logout() {
            if (confirm("Log out?")) {
                localStorage.removeItem('currentUser');
                location.href = "index.html";
            }
        }

        /* ---------- CHORES ---------- */
        async function loadChores() {
            const res = await fetch('/api/chores');
            const chores = await res.json();
            const list = document.getElementById('choresList');
            list.innerHTML = '';
            chores.forEach(c => {
                const div = document.createElement('div');
                div.className = 'item ' + (c.done ? 'done' : '');
                const assignedStr = c.assigned_to ? `<span style="color:#888;margin-left:8px;">(${c.assigned_to})</span>` : '';
                div.innerHTML = `<span>${c.title}${assignedStr}</span>
                                 <div>
                                   <button onclick="toggleChore(${c.id})">✓</button>
                                   <button onclick="deleteChore(${c.id})">Delete</button>
                                 </div>`;
                list.appendChild(div);
            });
        }
        async function addChore() {
            const title = prompt('Chore title:');
            if (title) {
                await fetch('/api/chores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                loadChores();
            }
        }
        async function toggleChore(id) {
            await fetch(`/api/chores/${id}`, { method: 'PUT' });
            loadChores();
        }
        async function deleteChore(id) {
            await fetch(`/api/chores/${id}`, { method: 'DELETE' });
            loadChores();
        }

        /* ---------- GROCERIES ---------- */
        async function loadGroceries() {
            const res = await fetch('/api/groceries');
            const items = await res.json();
            const list = document.getElementById('groceriesList');
            list.innerHTML = '';
            items.forEach(it => {
                const div = document.createElement('div');
                div.className = 'item ' + (it.bought ? 'bought' : '');
                div.innerHTML = `<span>${it.name}</span>
                                 <div>
                                   <button onclick="toggleItem(${it.id})">✓</button>
                                   <button onclick="deleteItem(${it.id})">Delete</button>
                                 </div>`;
                list.appendChild(div);
            });
        }
        async function addItem() {
            const name = prompt('Item name:');
            if (name) {
                await fetch('/api/groceries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                loadGroceries();
            }
        }
        async function toggleItem(id) {
            await fetch(`/api/groceries/${id}`, { method: 'PUT' });
            loadGroceries();
        }
        async function deleteItem(id) {
            await fetch(`/api/groceries/${id}`, { method: 'DELETE' });
            loadGroceries();
        }

        /* ---------- FINANCES ---------- */
        async function loadFinances() {
            const res = await fetch('/api/expenses');
            const exps = await res.json();
            const list = document.getElementById('financesList');
            list.innerHTML = '';
            
            // Sum per person
            const totals = {};
            exps.forEach(ex => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span><strong>${ex.member_name}</strong> – $${parseFloat(ex.amount).toFixed(2)} – ${ex.description || 'No description'}</span>
                                 <button onclick="deleteExpense(${ex.id})">Delete</button>`;
                list.appendChild(div);
                
                // Accumulate totals
                totals[ex.member_name] = (totals[ex.member_name] || 0) + parseFloat(ex.amount);
            });
            
            // Display summary and settlements
            if (Object.keys(totals).length > 0) {
                const names = Object.keys(totals);
                const totalSpent = Object.values(totals).reduce((a, b) => a + b, 0);
                const perPerson = totalSpent / names.length;
                
                // Calculate balances (positive = owed money, negative = owes money)
                const balances = {};
                names.forEach(name => {
                    balances[name] = totals[name] - perPerson;
                });
                
                // Calculate who pays whom
                const settlements = [];
                const debtors = names.filter(n => balances[n] < -0.01).map(n => ({ name: n, amount: -balances[n] }));
                const creditors = names.filter(n => balances[n] > 0.01).map(n => ({ name: n, amount: balances[n] }));
                
                let i = 0, j = 0;
                while (i < debtors.length && j < creditors.length) {
                    const payment = Math.min(debtors[i].amount, creditors[j].amount);
                    if (payment > 0.01) {
                        settlements.push(`${debtors[i].name} → ${creditors[j].name}: $${payment.toFixed(2)}`);
                    }
                    debtors[i].amount -= payment;
                    creditors[j].amount -= payment;
                    if (debtors[i].amount < 0.01) i++;
                    if (creditors[j].amount < 0.01) j++;
                }
                
                const summaryDiv = document.createElement('div');
                summaryDiv.style.cssText = 'margin-top:24px;padding:16px;background:#e9ecef;border-radius:12px;';
                summaryDiv.innerHTML = '<strong>Summary per person:</strong><br>' + 
                    Object.entries(totals)
                        .map(([name, total]) => `${name}: $${total.toFixed(2)}`)
                        .join('<br>') +
                    `<br><br><strong>Per person share:</strong> $${perPerson.toFixed(2)}` +
                    (settlements.length > 0 ? 
                        '<br><br><strong>Settlements:</strong><br>' + settlements.join('<br>') : 
                        '<br><br><em>All settled!</em>');
                list.appendChild(summaryDiv);
            }
        }
        async function addExpense() {
            // Load group members
            const groupRes = await fetch('/api/group');
            const members = await groupRes.json();
            
            if (members.length === 0) {
                alert('No group members available. Add people to your group first.');
                return;
            }

            // Select member
            const memberOptions = members.map((m, i) => `${i + 1}. ${m.name}`).join('\n');
            const memberIdx = parseInt(prompt(`Who paid?\n${memberOptions}`)) - 1;
            if (isNaN(memberIdx) || memberIdx < 0 || memberIdx >= members.length) return;

            const amount = parseFloat(prompt('Amount ($):'));
            if (isNaN(amount)) return;

            const description = prompt('Description:');

            await fetch('/api/expenses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    group_member_id: members[memberIdx].id,
                    amount, 
                    description 
                })
            });
            loadFinances();
        }
        async function deleteExpense(id) {
            await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
            loadFinances();
        }

        /* ---------- GROUP ---------- */
        async function loadGroup() {
            const res = await fetch('/api/group');
            const members = await res.json();
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            members.forEach(m => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span>${m.name}</span>
                                 <button onclick="deleteMember(${m.id})">Delete</button>`;
                list.appendChild(div);
            });
        }
        async function addMember() {
            const name = prompt('Person name:');
            if (name) {
                await fetch('/api/group', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                loadGroup();
            }
        }
        async function deleteMember(id) {
            await fetch(`/api/group/${id}`, { method: 'DELETE' });
            loadGroup();
        }

        /* ---------- ASSIGNMENTS ---------- */
        let assignmentsData = [];
        let choresData = [];
        let groupMembersData = [];

        async function loadAssignments() {
            // Fetch assignments, chores, and group members
            const [assignRes, choresRes, groupRes] = await Promise.all([
                fetch('/api/assignments'),
                fetch('/api/chores'),
                fetch('/api/group')
            ]);
            assignmentsData = await assignRes.json();
            choresData = await choresRes.json();
            groupMembersData = await groupRes.json();

            const list = document.getElementById('assignmentsList');
            list.innerHTML = '';
            
            if (assignmentsData.length === 0) {
                list.innerHTML = '<p style="text-align:center;opacity:.6">No assignments yet</p>';
                return;
            }

            assignmentsData.forEach(a => {
                const div = document.createElement('div');
                div.className = 'item';
                let dueStr = '';
                if (a.due_date) {
                    const date = new Date(a.due_date);
                    const d = String(date.getDate()).padStart(2, '0');
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const y = date.getFullYear();
                    dueStr = ` (due: ${d}.${m}.${y})`;
                }
                div.innerHTML = `<span><strong>${a.chore_title}</strong> → ${a.assigned_to_name}${dueStr}</span>
                                 <button onclick="deleteAssignment(${a.id})">Delete</button>`;
                list.appendChild(div);
            });
        }

        async function addAssignment() {
            // Load chores and group members
            const [choresRes, groupRes] = await Promise.all([
                fetch('/api/chores'),
                fetch('/api/group')
            ]);
            choresData = await choresRes.json();
            groupMembersData = await groupRes.json();

            if (choresData.length === 0) {
                alert('No chores available. Create a chore first.');
                return;
            }
            if (groupMembersData.length === 0) {
                alert('No group members available. Add people to your group first.');
                return;
            }

            // Select chore
            const choreOptions = choresData.map((c, i) => `${i + 1}. ${c.title}`).join('\n');
            const choreIdx = parseInt(prompt(`Select a chore:\n${choreOptions}`)) - 1;
            if (isNaN(choreIdx) || choreIdx < 0 || choreIdx >= choresData.length) return;

            // Select member
            const memberOptions = groupMembersData.map((m, i) => `${i + 1}. ${m.name}`).join('\n');
            const memberIdx = parseInt(prompt(`Assign to:\n${memberOptions}`)) - 1;
            if (isNaN(memberIdx) || memberIdx < 0 || memberIdx >= groupMembersData.length) return;

            // Optional due date (DD.MM.YYYY format)
            const dueDateInput = prompt('Due date (DD.MM.YYYY) or leave empty:');
            let dueDate = null;
            if (dueDateInput) {
                const parts = dueDateInput.split('.');
                if (parts.length === 3) {
                    dueDate = `${parts[2]}-${parts[1]}-${parts[0]}`; // Convert to YYYY-MM-DD
                }
            }

            await fetch('/api/assignments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chore_id: choresData[choreIdx].id,
                    group_member_id: groupMembersData[memberIdx].id,
                    due_date: dueDate
                })
            });
            loadAssignments();
        }

        async function deleteAssignment(id) {
            await fetch(`/api/assignments/${id}`, { method: 'DELETE' });
            loadAssignments();
        }

        /* ---------- INITIAL SHOW ---------- */
        // Show welcome message by default
    </script>
</body>
</html>
